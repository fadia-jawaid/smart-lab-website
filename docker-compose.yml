version: '3.8'

# NOTE: the Prisma schema (server/prisma/schema.prisma) uses SQLite, not
# Postgres — this file previously started a Postgres container and pointed
# DATABASE_URL at it, which Prisma rejects outright (the schema's
# `provider = "sqlite"` doesn't match a "postgresql://" connection string,
# so the server container would fail on startup, before even reaching the
# password-with-"@" URL-parsing problem the old POSTGRES_PASSWORD had).
# This now matches what the app actually uses: a SQLite file, persisted in
# a named volume so it survives a container restart.

services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file: ./server/.env
    environment:
      DATABASE_URL: file:/data/dev.db
      MQTT_BROKER:  mqtt://mqtt:1883
      CLIENT_URL:   http://localhost
    volumes:
      - sqlite_data:/data
    depends_on:
      mqtt:
        condition: service_started

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  sqlite_data:
  mosquitto_data:
  mosquitto_logs: